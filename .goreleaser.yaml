version: 2

project_name: synapses

before:
  hooks:
    - go mod verify

builds:
  - id: synapses
    main: ./cmd/synapses
    binary: synapses
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: synapses
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - COMMANDS.md
      - synapses.example.json

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: synapses
    name: synapses
  name_template: "{{.ProjectName}} {{.Version}}"
  draft: false
  prerelease: auto

brews:
  - name: synapses
    repository:
      owner: synapses
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/synapses/synapses"
    description: "Local-first, graph-based context manager for AI coding agents"
    license: "MIT"
    install: |
      bin.install "synapses"
    test: |
      system "#{bin}/synapses", "version"
