version: 2

project_name: synapses

before:
  hooks:
    - go mod verify
    - make completions

builds:
  - id: synapses
    main: ./cmd/synapses
    binary: synapses
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: synapses
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - synapses.example.json
      - completions/*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: SynapsesOS
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/SynapsesOS/synapses"
    description: "Graph-based code intelligence MCP server for AI coding agents"
    license: "MIT"
    install: |
      bin.install "synapses"
      bash_completion.install "completions/synapses.bash" => "synapses"
      zsh_completion.install "completions/synapses.zsh" => "_synapses"
      fish_completion.install "completions/synapses.fish"
    test: |
      system "#{bin}/synapses", "version"

release:
  github:
    owner: SynapsesOS
    name: synapses
  name_template: "{{.ProjectName}} {{.Version}}"
  draft: false
  prerelease: auto
