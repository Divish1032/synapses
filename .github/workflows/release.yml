name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./... -race -timeout 600s

  build-linux:
    name: Build (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate completions
        run: make completions
      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_linux_x86_64.tar.gz synapses README.md LICENSE synapses.example.json completions/
          rm synapses
      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_linux_arm64.tar.gz synapses README.md LICENSE synapses.example.json completions/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-archives
          path: |
            synapses_linux_x86_64.tar.gz
            synapses_linux_arm64.tar.gz

  build-darwin:
    name: Build (macOS)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate completions
        run: make completions
      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_darwin_arm64.tar.gz synapses README.md LICENSE synapses.example.json completions/
          rm synapses
      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_darwin_x86_64.tar.gz synapses README.md LICENSE synapses.example.json completions/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-archives
          path: |
            synapses_darwin_arm64.tar.gz
            synapses_darwin_x86_64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          find . -name '*.tar.gz' -exec mv {} . \;
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create ${{ github.ref_name }} \
            --title "synapses ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            *.tar.gz checksums.txt

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set — skipping Homebrew update"
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          DARWIN_ARM64_URL="https://github.com/SynapsesOS/synapses/releases/download/${GITHUB_REF_NAME}/synapses_darwin_arm64.tar.gz"
          DARWIN_AMD64_URL="https://github.com/SynapsesOS/synapses/releases/download/${GITHUB_REF_NAME}/synapses_darwin_x86_64.tar.gz"
          LINUX_AMD64_URL="https://github.com/SynapsesOS/synapses/releases/download/${GITHUB_REF_NAME}/synapses_linux_x86_64.tar.gz"

          # Download archives for SHA256
          curl -sL "$DARWIN_ARM64_URL" -o /tmp/darwin_arm64.tar.gz
          curl -sL "$DARWIN_AMD64_URL" -o /tmp/darwin_amd64.tar.gz
          curl -sL "$LINUX_AMD64_URL" -o /tmp/linux_amd64.tar.gz

          DARWIN_ARM64_SHA=$(sha256sum /tmp/darwin_arm64.tar.gz | awk '{print $1}')
          DARWIN_AMD64_SHA=$(sha256sum /tmp/darwin_amd64.tar.gz | awk '{print $1}')
          LINUX_AMD64_SHA=$(sha256sum /tmp/linux_amd64.tar.gz | awk '{print $1}')

          cat > /tmp/synapses.rb << FORMULA
          class Synapses < Formula
            desc "Graph-based code intelligence MCP server for AI coding agents"
            homepage "https://github.com/SynapsesOS/synapses"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${DARWIN_ARM64_URL}"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "${DARWIN_AMD64_URL}"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              url "${LINUX_AMD64_URL}"
              sha256 "${LINUX_AMD64_SHA}"
            end

            def install
              bin.install "synapses"
              bash_completion.install "completions/synapses.bash" => "synapses"
              zsh_completion.install "completions/synapses.zsh" => "_synapses"
              fish_completion.install "completions/synapses.fish"
            end

            test do
              system "#{bin}/synapses", "version"
            end
          end
          FORMULA

          # Generate cask formula (points to synapses-app DMG releases)
          cat > /tmp/synapses-cask.rb << CASK
          cask "synapses" do
            version "${VERSION}"

            on_arm do
              url "https://github.com/SynapsesOS/synapses-app/releases/download/v#{version}/Synapses-#{version}-arm64.dmg"
              sha256 :no_check
            end

            on_intel do
              url "https://github.com/SynapsesOS/synapses-app/releases/download/v#{version}/Synapses-#{version}-x64.dmg"
              sha256 :no_check
            end

            name "Synapses"
            desc "Code intelligence for AI agents"
            homepage "https://synapsesos.com"

            app "Synapses.app"

            postflight do
              # Copy binary from app bundle to ~/.synapses/bin for CLI access
              bin_dir = "#{ENV['HOME']}/.synapses/bin"
              FileUtils.mkdir_p(bin_dir)
              ["synapses", "synapses-aarch64-apple-darwin", "synapses-x86_64-apple-darwin"].each do |name|
                binary = "#{appdir}/Synapses.app/Contents/Resources/#{name}"
                if File.exist?(binary)
                  FileUtils.cp(binary, "#{bin_dir}/synapses")
                  FileUtils.chmod(0755, "#{bin_dir}/synapses")
                  break
                end
              end
            end

            zap trash: [
              "~/.synapses",
              "~/Library/LaunchAgents/com.synapsesos.daemon.plist",
            ]
          end
          CASK

          # Push to homebrew-tap
          cd /tmp
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/SynapsesOS/homebrew-tap.git"
          mkdir -p homebrew-tap/Casks
          cp synapses.rb homebrew-tap/Formula/synapses.rb
          cp synapses-cask.rb homebrew-tap/Casks/synapses.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/synapses.rb Casks/synapses.rb
          git commit -m "synapses ${VERSION}" || echo "No changes to commit"
          git push
