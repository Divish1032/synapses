name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Release (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs full git history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -race -timeout 120s

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-darwin:
    name: Release (macOS)
    needs: release-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate completions
        run: make completions

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_darwin_x86_64.tar.gz synapses README.md LICENSE synapses.example.json completions/
          rm synapses

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -o synapses -ldflags "-s -w -X main.version=${VERSION}" ./cmd/synapses
          tar czf synapses_darwin_arm64.tar.gz synapses README.md LICENSE synapses.example.json completions/
          rm synapses

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            synapses_darwin_x86_64.tar.gz \
            synapses_darwin_arm64.tar.gz
