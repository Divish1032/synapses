version: "2"

linters:
  enable:
    - govet          # go vet checks
    - staticcheck    # broad static analysis (covers most of errcheck's real cases)
    - unused         # unexported identifiers never used
    - misspell       # common English misspellings in comments
    - revive         # drop-in golint replacement
  disable:
    - errcheck       # too noisy: defer Close() patterns are idiomatic Go
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck  # allow e.g. graph.GraphSummary

formatters:
  enable:
    - goimports      # import grouping + gofmt formatting
  settings:
    goimports:
      local-prefixes:
        - github.com/Divish1032/synapses

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
